{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - CareerPilot</title>

    <link rel="stylesheet"
          href="{% static 'analyses/css/base.css' %}">

    <link rel="stylesheet"
          href="{% static 'accounts/login.css' %}">
</head>

<body class="login-page">
    {% include "analyses/header.html" %}

    <main class="login-card">
        <h1>Welcome back</h1>
        <p class="login-intro">
            Log in to continue using CareerPilot.
        </p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Log in</button>
        </form>

        <p class="login-link">
            Do not have an account?
            <a href="{% url 'register' %}">Sign up</a>
        </p>

        <p class="login-link">
            <a href="{% url 'home' %}">Back to home</a>
        </p>
    </main>
</body>
</html>
