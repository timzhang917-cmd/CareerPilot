<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Login - CareerPilot</title>
</head>

<body>
    <main>
        <h1>Login to CareerPilot</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Login</button>
        </form>

        <p>
            Do not have an account?
            <a href="{% url 'register' %}">Sign up</a>
        </p>

        <p>
            <a href="{% url 'home' %}">Back to home</a>
        </p>
    </main>
</body>
</html>
