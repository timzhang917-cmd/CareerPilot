<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Sign up - CareerPilot</title>
</head>

<body>
    <main>
        <h1>Create your account</h1>

        <form method="post">
            {% csrf_token %}  <!-- 防止CSRF攻击 -->
            {{ form.as_p }}   <!-- 让Django自动显示用户名、两次密码输入框、帮助文字和错误提示 -->

            <button type="submit">Sign up</button>
        </form>

        <p>
            <a href="{% url 'home' %}">Back to home</a>
        </p>
    </main>
</body>
</html>
