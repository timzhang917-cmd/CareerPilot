<section class="job-results">
    <h2>Available Companies</h2>

    <div class="job-card-list">
        <!-- 循环显示筛选后的公司招聘信息 -->
        {% for job in job_listings %}
            <article class="job-card">
                <h3 class="job-company-name">
                    {{ job.company_name }}
                </h3>

                <p class="job-card-field">
                    <span>Industry</span>
                    {{ job.industry }}
                </p>

                <p class="job-card-field"
                   title="{{ job.location }}">
                    <span>Location</span>
                    {{ job.location }}
                </p>

                <p class="job-card-field job-position-field"
                   title="{{ job.job_positions }}">
                    <span>Positions</span>
                    {{ job.job_positions }}
                </p>

                <a class="official-site-button"
                   href="{{ job.official_url }}"
                   target="_blank"
                   rel="noopener noreferrer">
                    Official Site →
                </a>
            </article>
        {% empty %}
            <div class="job-empty-state">
                <h3>No matching companies found</h3>
                <p>Try changing or clearing the current filters.</p>
            </div>
        {% endfor %}
    </div>
</section>
