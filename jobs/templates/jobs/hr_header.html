<header>
    <nav>
        <strong>CareerPilot</strong>

        {% if user.is_authenticated %}
            <button
                type="button"
                id="profile-open"
                class="btn btn-soft btn-sm"
                aria-haspopup="dialog"
                aria-controls="profile-modal">
                Hello, {{ user.username }}
            </button>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}

                <button class="btn btn-soft btn-sm" type="submit">
                    Logout
                </button>
            </form>
        {% endif %}
    </nav>
</header>

{% if user.is_authenticated %}
    {% include "analyses/_profile_modal.html" %}
{% endif %}
