{% load static %}

<header>
    <nav>
        <strong>CareerPilot</strong>

        {% if user.is_authenticated %}
            <button
                type="button"
                id="profile-open"
                aria-haspopup="dialog"
                aria-controls="profile-modal">
                Hello, {{ user.username }}
            </button>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}

                <button type="submit">
                    Logout
                </button>
            </form>
        {% endif %}
    </nav>
</header>

{% if user.is_authenticated %}
    <!-- User profile modal, hidden by default -->
    <div id="profile-modal"
         class="profile-overlay"
         role="dialog"
         aria-modal="true"
         aria-labelledby="profile-title"
         hidden>

        <section class="profile-card">
            <div class="profile-header">
                <h2 id="profile-title">
                    User Profile
                </h2>

                <button
                    type="button"
                    id="profile-close-x"
                    class="profile-close-x"
                    aria-label="Close profile">
                    ×
                </button>
            </div>

            <div class="profile-content">
                <div class="profile-avatar">
                    {{ user.username|first|upper }}
                </div>

                <h3>Hello, {{ user.username }}</h3>

                <div class="profile-information">
                    <div class="profile-row">
                        <strong>Username</strong>
                        <span>{{ user.username }}</span>
                    </div>

                    <div class="profile-row">
                        <strong>Joined</strong>
                        <span>
                            {{ user.date_joined|date:"F j, Y" }}
                        </span>
                    </div>
                </div>

                <button
                    type="button"
                    id="profile-close-button"
                    class="profile-close-button">
                    Close
                </button>
            </div>
        </section>
    </div>

    <script src="{% static 'analyses/js/profile.js' %}?v=0812-profile">
    </script>
{% endif %}
