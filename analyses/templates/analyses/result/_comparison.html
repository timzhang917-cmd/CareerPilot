<!-- 岗位要求与候选人证据对照表 -->
<section class="comparison-card">
    <h2>Job Requirement Comparison</h2>

    <!-- 窄屏时由这个容器负责横向滚动 -->
    <div class="comparison-table-wrapper">
        <table class="comparison-table">
            <thead>
                <tr>
                    <th scope="col">Requirement</th>
                    <th scope="col">Candidate Evidence</th>
                    <th scope="col">Assessment</th>
                </tr>
            </thead>

            <tbody>
                {% for item in result.requirements %}
                    <tr>
                        <td>{{ item.requirement }}</td>

                        <td>{{ item.evidence }}</td>

                        <td>
                            <span
                                class="assessment-badge assessment-{{ item.assessment|slugify }}"
                            >
                                {{ item.assessment }}
                            </span>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="3">
                            No requirement comparison is available.
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
