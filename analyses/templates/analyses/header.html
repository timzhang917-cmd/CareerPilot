<header>
    <nav>
        <strong>CareerPilot</strong>

        {% with current=request.resolver_match.url_name %}
        <div class="main-nav">
            <!-- back home -->
            <a class="btn btn-soft" href="{% url 'home' %}"
               {% if current == 'home' %}aria-current="page"{% endif %}>Home</a>

            <a class="btn btn-soft" href="{% url 'analysis_result' %}"
               {% if current == 'analysis_result' or current == 'analysis_detail' or current == 'analysis_history' %}aria-current="page"{% endif %}>
                Analysis
            </a>

            <a class="btn btn-soft" href="{% url 'job_search' %}"
               {% if current == 'job_search' or current == 'my_applications' %}aria-current="page"{% endif %}>Jobs</a> <!--8.11changed, build mapping-->
            <a class="btn btn-soft" href="{% url 'community' %}"
               {% if current == 'community' %}aria-current="page"{% endif %}>Community</a>
        </div>
        {% endwith %}

        {% if user.is_authenticated %}
            <!-- press to open profile modal -->
            <button
                type="button"
                id="profile-open"
                class="btn btn-soft btn-sm"
                aria-haspopup="dialog"
                aria-controls="profile-modal">
                Hello, {{ user.username }}
            </button>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="btn btn-soft btn-sm" type="submit">Logout</button>
            </form>
        {% else %}
            <a class="btn btn-soft btn-sm"
               href="{% url 'login' %}">
                Login
            </a>

            <a class="btn btn-soft btn-sm"
               href="{% url 'register' %}">
                Sign up
            </a>
        {% endif %}
    </nav>
</header>

{% if user.is_authenticated %}
    {% include "analyses/_profile_modal.html" %}
{% endif %}
