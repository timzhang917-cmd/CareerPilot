{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CareerPilot{% endblock %}</title>

    <!-- common -->
    <link rel="stylesheet" href="{% static 'analyses/css/base.css' %}">

    <!-- User profile modal styles -->
    <link rel="stylesheet" href="{% static 'analyses/css/profile.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
    {% block header %}{% include "analyses/header.html" %}{% endblock %}

    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}
</body>
</html>
